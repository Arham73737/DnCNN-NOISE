services:
  - type: web
    name: dncnn-noise-removal
    runtime: python
    buildCommand: pip install --extra-index-url https://download.pytorch.org/whl/cpu torch==2.3.1 torchvision==0.18.1 && pip install -r requirements.txt
    startCommand: gunicorn --chdir DnCNN app:app --bind 0.0.0.0:$PORT --timeout 120 --workers 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
